[project]
name = "qpgen-model"
version = "0.1.0"
description = "AI-Based Curriculum-Aligned Mathematics Question Paper Generator"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-google-genai>=2",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "PyMuPDF>=1.25",
    "python-docx>=1.1",
    "sympy>=1.13",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*langchain-community.*:DeprecationWarning",
]
